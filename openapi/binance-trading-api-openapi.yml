      tags:
      - Trading
      parameters:
      - $ref: '#/components/parameters/symbolRequired_3'
      - name: orderId
        in: query
        description: Order ID.
        schema:
          type: integer
          format: int64
      - name: origClientOrderId
        in: query
        description: Client order ID.
        schema:
          type: string
      - $ref: '#/components/parameters/recvWindow_3'
      - $ref: '#/components/parameters/timestamp_3'
      - $ref: '#/components/parameters/signature_3'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FuturesOrder'
      security:
      - apiKey: []
        hmacSignature: []
    delete:
