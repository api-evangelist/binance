      security:
      - apiKey: []
        hmacSignature: []
  /sapi/v1/margin/order:
    post:
      operationId: createMarginOrder
      summary: Margin account new order
      description: Place a new order for margin account.
      tags:
      - Trading
      parameters:
      - name: symbol
        in: query
        required: true
        schema:
          type: string
      - name: isIsolated
        in: query
