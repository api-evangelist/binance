  /fapi/v1/order:
    post:
      operationId: createOrder
      summary: New order
      description: Send in a new futures order. Supports LIMIT, MARKET, STOP, STOP_MARKET, TAKE_PROFIT, TAKE_PROFIT_MARKET, and TRAILING_STOP_MARKET order types.
      tags:
      - Trading
      parameters:
      - $ref: '#/components/parameters/symbolRequired_3'
      - name: side
        in: query
        required: true
        description: Order side.
        schema:
          type: string
          enum:
          - BUY
          - SELL
      - name: positionSide
        in: query
        description: Position side for hedge mode. BOTH for one-way mode.
        schema:
          type: string
          enum:
          - BOTH
          - LONG
          - SHORT
          default: BOTH
      - name: type
        in: query
        required: true
        description: Order type.
        schema:
          type: string
          enum:
          - LIMIT
          - MARKET
          - STOP
          - STOP_MARKET
          - TAKE_PROFIT
          - TAKE_PROFIT_MARKET
          - TRAILING_STOP_MARKET
      - name: timeInForce
        in: query
        description: Time in force. Required for LIMIT orders.
        schema:
          type: string
          enum:
          - GTC
          - IOC
          - FOK
          - GTX
          - GTD
      - name: quantity
        in: query
        description: Order quantity.
        schema:
          type: string
      - name: reduceOnly
        in: query
        description: Reduce only flag. Cannot be sent with closePosition.
        schema:
          type: boolean
      - name: price
        in: query
        description: Order price.
        schema:
          type: string
      - name: newClientOrderId
        in: query
        description: A unique ID among open orders.
        schema:
          type: string
      - name: stopPrice
        in: query
        description: Stop price for stop orders.
        schema:
          type: string
      - name: closePosition
        in: query
        description: Close all positions when triggered.
        schema:
          type: boolean
      - name: activationPrice
        in: query
        description: Activation price for TRAILING_STOP_MARKET orders.
        schema:
          type: string
      - name: callbackRate
        in: query
        description: Callback rate for TRAILING_STOP_MARKET orders.
        schema:
          type: string
      - name: workingType
        in: query
        description: Stop price working type.
        schema:
          type: string
          enum:
          - MARK_PRICE
          - CONTRACT_PRICE
          default: CONTRACT_PRICE
      - name: priceProtect
        in: query
        description: Price protection flag.
        schema:
          type: boolean
      - name: newOrderRespType
        in: query
        description: Response type. ACK or RESULT.
        schema:
          type: string
          enum:
          - ACK
          - RESULT
