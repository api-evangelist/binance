openapi: 3.1.0
info:
  title: Binance Algo Account Trading API
  description: The Binance Algo Trading API provides access to algorithmic order execution strategies such as TWAP (Time-Weighted Average Price) and volume participation algorithms. Developers can place large orders that are automatically broken into smaller child orders and executed over time to minimize market impact.
  version: '1'
  contact:
    name: Binance Support
    url: https://www.binance.com/en/support
  termsOfService: https://www.binance.com/en/terms
servers:
- url: https://api.binance.com
  description: Production Server
security:
- apiKey: []
tags:
- name: Trading
  description: Trading endpoints for COIN-M futures orders.
paths:
  /dapi/v1/order:
    post:
      operationId: createOrder
      summary: New order
      description: Send in a new COIN-M futures order.
      tags:
      - Trading
      parameters:
      - $ref: '#/components/parameters/symbolRequired'
      - name: side
        in: query
        required: true
        schema:
          type: string
          enum:
          - BUY
          - SELL
      - name: positionSide
        in: query
        schema:
          type: string
          enum:
          - BOTH
          - LONG
          - SHORT
      - name: type
        in: query
        required: true
        schema:
          type: string
          enum:
          - LIMIT
          - MARKET
          - STOP
          - STOP_MARKET
          - TAKE_PROFIT
          - TAKE_PROFIT_MARKET
          - TRAILING_STOP_MARKET
      - name: timeInForce
        in: query
        schema:
          type: string
          enum:
          - GTC
          - IOC
          - FOK
          - GTX
      - name: quantity
        in: query
        schema:
          type: string
      - name: reduceOnly
        in: query
        schema:
          type: boolean
      - name: price
        in: query
        schema:
          type: string
      - name: newClientOrderId
        in: query
        schema:
          type: string
      - name: stopPrice
        in: query
        schema:
          type: string
      - name: activationPrice
        in: query
        schema:
          type: string
      - name: callbackRate
        in: query
        schema:
          type: string
      - name: workingType
        in: query
        schema:
          type: string
          enum:
          - MARK_PRICE
          - CONTRACT_PRICE
      - name: newOrderRespType
        in: query
        schema:
          type: string
          enum:
          - ACK
          - RESULT
      - $ref: '#/components/parameters/recvWindow'
      - $ref: '#/components/parameters/timestamp'
      - $ref: '#/components/parameters/signature'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      security:
      - apiKey: []
        hmacSignature: []
    get:
      operationId: getOrder
      summary: Query order
      description: Check an order's status.
      tags:
      - Trading
      parameters:
      - $ref: '#/components/parameters/symbolRequired'
      - name: orderId
        in: query
        schema:
          type: integer
          format: int64
      - name: origClientOrderId
        in: query
        schema:
          type: string
      - $ref: '#/components/parameters/recvWindow'
      - $ref: '#/components/parameters/timestamp'
      - $ref: '#/components/parameters/signature'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
      security:
      - apiKey: []
        hmacSignature: []
    delete:
      operationId: cancelOrder
      summary: Cancel order
      description: Cancel an active COIN-M futures order.
      tags:
      - Trading
      parameters:
      - $ref: '#/components/parameters/symbolRequired'
      - name: orderId
        in: query
        schema:
          type: integer
          format: int64
      - name: origClientOrderId
        in: query
        schema:
          type: string
      - $ref: '#/components/parameters/recvWindow'
      - $ref: '#/components/parameters/timestamp'
      - $ref: '#/components/parameters/signature'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
      security:
      - apiKey: []
        hmacSignature: []
  /dapi/v1/openOrders:
    get:
      operationId: getOpenOrders
      summary: Current all open orders
      description: Get all open COIN-M futures orders.
      tags:
      - Trading
      parameters:
