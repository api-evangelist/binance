        schema:
          type: string
      - name: side
        in: query
        required: true
        schema:
          type: string
          enum:
          - BUY
          - SELL
      - name: type
        in: query
        required: true
        schema:
          type: string
      - name: quantity
        in: query
        schema:
          type: string
      - name: price
        in: query
        schema:
          type: string
      - name: timeInForce
        in: query
        schema:
          type: string
      - name: recvWindow
        in: query
        schema:
