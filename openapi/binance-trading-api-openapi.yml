      required: true
      description: Trading pair symbol, e.g. BTCUSDT.
      schema:
        type: string
      example: BTCUSDT
    timestamp_2:
      name: timestamp
      in: query
      required: true
      description: Request timestamp in milliseconds since Unix epoch.
      schema:
        type: integer
        format: int64
    signature_3:
