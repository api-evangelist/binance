      - name: price
        in: query
        required: true
        schema:
          type: string
      - name: timeInForce
        in: query
        schema:
          type: string
          enum:
          - GTC
          - IOC
          - FOK
      - name: reduceOnly
        in: query
        schema:
          type: boolean
      - name: postOnly
        in: query
        schema:
          type: boolean
      - name: newOrderRespType
        in: query
        schema:
          type: string
          enum:
          - ACK
          - RESULT
      - name: clientOrderId
        in: query
        schema:
          type: string
      - name: isMmp
        in: query
