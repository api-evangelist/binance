        schema:
          type: string
          enum:
          - 'TRUE'
          - 'FALSE'
      - name: side
        in: query
        required: true
        schema:
          type: string
          enum:
          - BUY
          - SELL
      - name: type
        in: query
        required: true
        schema:
          type: string
          enum:
          - LIMIT
          - MARKET
          - STOP_LOSS
          - STOP_LOSS_LIMIT
          - TAKE_PROFIT
          - TAKE_PROFIT_LIMIT
          - LIMIT_MAKER
      - name: quantity
        in: query
        schema:
          type: string
      - name: quoteOrderQty
        in: query
        schema:
          type: string
      - name: price
        in: query
        schema:
          type: string
      - name: stopPrice
        in: query
        schema:
          type: string
      - name: newClientOrderId
        in: query
        schema:
          type: string
      - name: newOrderRespType
        in: query
        schema:
          type: string
          enum:
          - ACK
          - RESULT
          - FULL
      - name: timeInForce
        in: query
        schema:
          type: string
          enum:
          - GTC
          - IOC
          - FOK
      - name: sideEffectType
        in: query
        description: NO_SIDE_EFFECT, MARGIN_BUY, or AUTO_REPAY.
        schema:
          type: string
          enum:
          - NO_SIDE_EFFECT
          - MARGIN_BUY
          - AUTO_REPAY
          - AUTO_BORROW_REPAY
      - name: recvWindow
        in: query
        schema:
          type: integer
      - name: timestamp
        in: query
        required: true
        schema:
          type: integer
          format: int64
      - name: signature
        in: query
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
      security:
      - apiKey: []
        hmacSignature: []
    get:
      operationId: getMarginOrder
      summary: Query margin account order
      description: Query a margin account order.
      tags:
      - Trading
      parameters:
      - name: symbol
        in: query
        required: true
        schema:
          type: string
      - name: isIsolated
        in: query
        schema:
          type: string
      - name: orderId
        in: query
        schema:
          type: integer
          format: int64
      - name: origClientOrderId
        in: query
        schema:
          type: string
      - name: recvWindow
        in: query
        schema:
          type: integer
      - name: timestamp
        in: query
        required: true
        schema:
          type: integer
          format: int64
      - name: signature
        in: query
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
      security:
      - apiKey: []
        hmacSignature: []
    delete:
      operationId: cancelMarginOrder
      summary: Cancel margin account order
      description: Cancel an active margin order.
      tags:
      - Trading
      parameters:
      - name: symbol
        in: query
        required: true
        schema:
          type: string
      - name: isIsolated
        in: query
        schema:
          type: string
      - name: orderId
        in: query
        schema:
          type: integer
          format: int64
      - name: origClientOrderId
        in: query
        schema:
          type: string
      - name: recvWindow
        in: query
        schema:
          type: integer
      - name: timestamp
        in: query
        required: true
        schema:
          type: integer
          format: int64
      - name: signature
        in: query
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
      security:
      - apiKey: []
        hmacSignature: []
  /sapi/v1/margin/openOrders:
    get:
      operationId: getMarginOpenOrders
      summary: Query margin account open orders
      description: Get all open margin orders for a symbol.
      tags:
      - Trading
      parameters:
      - name: symbol
        in: query
        schema:
          type: string
      - name: isIsolated
        in: query
        schema:
          type: string
      - name: recvWindow
        in: query
        schema:
          type: integer
      - name: timestamp
        in: query
