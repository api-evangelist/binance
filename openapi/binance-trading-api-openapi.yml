                $ref: '#/components/schemas/FuturesOrderResponse'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error_3'
      security:
      - apiKey: []
        hmacSignature: []
    get:
      operationId: getOrder
