components:
  parameters:
    symbol:
      name: symbol
      in: query
      schema:
        type: string
    symbolRequired:
      name: symbol
      in: query
      required: true
      schema:
        type: string
    symbol_3:
      name: symbol
      in: query
      description: Futures trading pair symbol, e.g. BTCUSDT.
      schema:
        type: string
    symbol_2:
      name: symbol
      in: query
      description: Trading pair symbol, e.g. BTCUSDT.
      schema:
        type: string
      example: BTCUSDT
    symbolRequired_3:
      name: symbol
      in: query
      required: true
      description: Futures trading pair symbol, e.g. BTCUSDT.
      schema:
        type: string
    symbolRequired_2:
      name: symbol
      in: query
      required: true
      description: Trading pair symbol, e.g. BTCUSDT.
      schema:
        type: string
      example: BTCUSDT
    interval:
      name: interval
      in: query
      required: true
      description: Kline/candlestick interval.
      schema:
        type: string
        enum:
        - 1s
        - 1m
        - 3m
        - 5m
        - 15m
        - 30m
        - 1h
        - 2h
        - 4h
        - 6h
        - 8h
        - 12h
        - 1d
        - 3d
        - 1w
        - 1M
  schemas:
    FuturesTrade:
      type: object
      properties:
        id:
          type: integer
          format: int64
          description: Trade ID.
        price:
          type: string
          description: Trade price.
        qty:
          type: string
          description: Trade quantity.
        quoteQty:
          type: string
          description: Quote quantity.
        time:
          type: integer
          format: int64
          description: Trade time.
        isBuyerMaker:
          type: boolean
          description: Whether buyer is maker.
    FuturesTicker24hr:
      type: object
      properties:
        symbol:
          type: string
          description: Symbol.
        priceChange:
          type: string
          description: Price change.
        priceChangePercent:
          type: string
          description: Price change percent.
        weightedAvgPrice:
          type: string
          description: Weighted average price.
        lastPrice:
          type: string
          description: Last price.
        lastQty:
          type: string
          description: Last quantity.
        openPrice:
          type: string
          description: Open price.
        highPrice:
          type: string
          description: High price.
        lowPrice:
          type: string
          description: Low price.
        volume:
          type: string
          description: Total traded base asset volume.
        quoteVolume:
          type: string
          description: Total traded quote asset volume.
        openTime:
          type: integer
          format: int64
          description: Statistics open time.
        closeTime:
          type: integer
          format: int64
          description: Statistics close time.
        firstId:
          type: integer
          format: int64
          description: First trade ID.
        lastId:
          type: integer
          format: int64
          description: Last trade ID.
        count:
          type: integer
          description: Number of trades.
    PriceTicker:
      type: object
      properties:
        symbol:
          type: string
          description: Trading pair symbol.
        price:
          type: string
          description: Current price.
    Trade:
      type: object
      properties:
        id:
          type: integer
          format: int64
          description: Trade ID.
        price:
          type: string
          description: Trade price.
        qty:
          type: string
          description: Trade quantity.
        quoteQty:
          type: string
          description: Trade quote quantity.
        time:
          type: integer
          format: int64
          description: Trade time in milliseconds.
        isBuyerMaker:
          type: boolean
          description: Whether the buyer is the maker.
        isBestMatch:
          type: boolean
          description: Whether this is the best price match.
    FuturesSymbol:
      type: object
      properties:
        symbol:
          type: string
          description: Trading pair symbol.
        pair:
          type: string
          description: Underlying pair.
        contractType:
          type: string
          enum:
          - PERPETUAL
          - CURRENT_MONTH
          - NEXT_MONTH
          - CURRENT_QUARTER
          - NEXT_QUARTER
          description: Contract type.
        deliveryDate:
          type: integer
          format: int64
          description: Delivery date in milliseconds.
        onboardDate:
          type: integer
          format: int64
          description: Onboard date in milliseconds.
        status:
          type: string
          description: Symbol status.
        baseAsset:
          type: string
          description: Base asset.
        quoteAsset:
          type: string
          description: Quote asset.
        marginAsset:
          type: string
          description: Margin asset.
        pricePrecision:
          type: integer
          description: Price precision.
        quantityPrecision:
          type: integer
          description: Quantity precision.
        underlyingType:
          type: string
          description: Underlying asset type.
        settlePlan:
          type: integer
          description: Settlement plan.
        triggerProtect:
          type: string
          description: Trigger protection threshold.
        filters:
          type: array
          items:
            type: object
          description: Symbol filters.
        orderTypes:
          type: array
          items:
            type: string
          description: Allowed order types.
        timeInForce:
          type: array
          items:
            type: string
          description: Allowed time in force values.
    OrderBook:
      type: object
      properties:
        lastUpdateId:
          type: integer
          format: int64
          description: Last update ID for the order book.
        bids:
          type: array
          items:
            type: array
            items:
              type: string
          description: Bid price and quantity pairs.
        asks:
          type: array
          items:
            type: array
            items:
              type: string
          description: Ask price and quantity pairs.
    AggTrade:
      type: object
      properties:
        a:
          type: integer
          format: int64
          description: Aggregate trade ID.
        p:
          type: string
          description: Price.
        q:
          type: string
          description: Quantity.
        f:
          type: integer
          format: int64
          description: First trade ID.
        l:
          type: integer
          format: int64
          description: Last trade ID.
        T:
          type: integer
          format: int64
          description: Timestamp in milliseconds.
        m:
          type: boolean
          description: Was the buyer the maker.
        M:
          type: boolean
          description: Was the trade the best price match.
    MarkPrice:
      type: object
      properties:
        symbol:
          type: string
          description: Futures symbol.
        markPrice:
          type: string
          description: Mark price.
        indexPrice:
          type: string
          description: Index price.
        estimatedSettlePrice:
          type: string
          description: Estimated settle price.
        lastFundingRate:
          type: string
          description: Last funding rate.
        nextFundingTime:
          type: integer
          format: int64
          description: Next funding time in milliseconds.
        interestRate:
          type: string
          description: Interest rate.
        time:
          type: integer
          format: int64
          description: Timestamp.
    Ticker24hr:
      type: object
      properties:
        symbol:
          type: string
          description: Trading pair symbol.
        priceChange:
          type: string
          description: Price change over the period.
        priceChangePercent:
          type: string
          description: Price change percentage.
        weightedAvgPrice:
          type: string
          description: Weighted average price.
        prevClosePrice:
          type: string
          description: Previous close price.
        lastPrice:
          type: string
          description: Last trade price.
        lastQty:
          type: string
          description: Last trade quantity.
        bidPrice:
          type: string
          description: Best bid price.
        bidQty:
          type: string
          description: Best bid quantity.
        askPrice:
          type: string
          description: Best ask price.
        askQty:
          type: string
          description: Best ask quantity.
        openPrice:
          type: string
          description: Open price.
        highPrice:
          type: string
          description: High price.
        lowPrice:
          type: string
          description: Low price.
        volume:
          type: string
          description: Base asset volume.
        quoteVolume:
          type: string
          description: Quote asset volume.
        openTime:
          type: integer
          format: int64
          description: Statistics open time in milliseconds.
        closeTime:
          type: integer
          format: int64
          description: Statistics close time in milliseconds.
        firstId:
          type: integer
          format: int64
          description: First trade ID.
        lastId:
          type: integer
          format: int64
          description: Last trade ID.
        count:
          type: integer
          description: Total number of trades.
    BookTicker:
      type: object
      properties:
        symbol:
          type: string
          description: Trading pair symbol.
        bidPrice:
          type: string
          description: Best bid price.
        bidQty:
          type: string
          description: Best bid quantity.
        askPrice:
          type: string
          description: Best ask price.
        askQty:
          type: string
          description: Best ask quantity.
  securitySchemes:
    apiKey:
      type: apiKey
      in: header
      name: X-MBX-APIKEY
    hmacSignature:
      type: apiKey
      in: query
      name: signature
externalDocs:
  description: Binance Algo Trading Documentation
  url: https://developers.binance.com/docs/algo/general-info
