- aid: binance:spot-websocket-api
  name: Binance Spot WebSocket API
  tags:
  - Cryptocurrency
  - Market Data
  - Real-Time
  - Streaming
  - WebSocket
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  baseURL: wss://ws-api.binance.com
  humanURL: https://developers.binance.com/docs/binance-spot-api-docs/web-socket-api
  properties:
  - url: https://developers.binance.com/docs/binance-spot-api-docs/web-socket-api
    type: Documentation
  - url: asyncapi/binance-spot-websocket-api-asyncapi.yml
    type: AsyncAPI
  description: >-
    The Binance Spot WebSocket API provides an alternative way to access spot trading functionality through
    persistent WebSocket connections. It is functionally equivalent to the REST API, accepting the same
    parameters and returning the same status and error codes, but offers lower latency for time-sensitive
    trading operations.
- aid: binance:spot-websocket-streams
  name: Binance Spot WebSocket Streams
  tags:
  - Cryptocurrency
  - Market Data
  - Real-Time
  - Streaming
  - WebSocket
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  baseURL: wss://stream.binance.com
  humanURL: https://developers.binance.com/docs/binance-spot-api-docs/web-socket-streams
  properties:
  - url: https://developers.binance.com/docs/binance-spot-api-docs/web-socket-streams
    type: Documentation
  - url: asyncapi/binance-spot-websocket-streams-asyncapi.yml
    type: AsyncAPI
  description: >-
    Binance Spot WebSocket Streams deliver real-time market data updates via persistent WebSocket connections.
    Developers can subscribe to individual symbol ticker streams, aggregate trade streams, kline and candlestick
    data, depth-of-book updates, and mini-ticker streams. The service supports both single and combined
    stream subscriptions, enabling efficient consumption of live market data for trading bots, dashboards,
    and analytics applications without polling the REST API.
